basePath: /api/v1
definitions:
  billingModels.Tier:
    enum:
    - free
    - basic
    - unlimited
    type: string
    x-enum-varnames:
    - TierFree
    - TierBasic
    - TierUnlimited
  billingServices.OversightRow:
    properties:
      billing_provider:
        type: string
      current_period_end:
        type: string
      email:
        type: string
      phone:
        type: string
      product_id:
        type: string
      status:
        type: string
      tier:
        type: string
      user_id:
        type: string
    type: object
  billingServices.StorageStatus:
    properties:
      available_bytes:
        type: integer
      bytes_used:
        type: integer
      quota_bytes:
        description: -1 when unlimited (not used today; max tier is 50 GB)
        type: integer
      tier:
        $ref: '#/definitions/billingModels.Tier'
    type: object
  billingServices.SubscriptionSummary:
    properties:
      by_provider:
        additionalProperties:
          type: integer
        type: object
      by_status:
        additionalProperties:
          type: integer
        type: object
      by_tier:
        additionalProperties:
          type: integer
        type: object
      total:
        type: integer
    type: object
  forms.AppleVerifyForm:
    properties:
      transaction_id:
        type: string
    required:
    - transaction_id
    type: object
  forms.CategoryForm:
    properties:
      name:
        example: Groceries
        maxLength: 255
        type: string
    required:
    - name
    type: object
  forms.ChangeRoleForm:
    properties:
      role:
        enum:
        - editor
        - viewer
        example: viewer
        type: string
    required:
    - role
    type: object
  forms.CommentForm:
    properties:
      body:
        example: Grab the 2L one
        maxLength: 2000
        type: string
    required:
    - body
    type: object
  forms.CreateItemForm:
    properties:
      attributes:
        additionalProperties: true
        type: object
      brand:
        type: string
      category_id:
        type: string
      name:
        example: Milk
        maxLength: 255
        type: string
      notes:
        type: string
      price:
        example: 3.99
        type: number
    required:
    - name
    type: object
  forms.CreateListForm:
    properties:
      category_id:
        type: string
      grouped_list_id:
        type: string
      is_periodic:
        type: boolean
      is_public:
        type: boolean
      name:
        example: Weekly groceries
        maxLength: 255
        type: string
    required:
    - name
    type: object
  forms.FacebookAuthForm:
    properties:
      access_token:
        type: string
    required:
    - access_token
    type: object
  forms.GenerateTodayForm:
    properties:
      exclude_item_ids:
        items:
          type: string
        type: array
    type: object
  forms.GoogleAuthForm:
    properties:
      id_token:
        type: string
    required:
    - id_token
    type: object
  forms.GoogleVerifyForm:
    properties:
      purchase_token:
        type: string
      subscription_id:
        example: dalista.basic.monthly
        type: string
    required:
    - purchase_token
    - subscription_id
    type: object
  forms.GroupedListForm:
    properties:
      name:
        example: Home
        maxLength: 255
        type: string
    required:
    - name
    type: object
  forms.LoginEmailForm:
    properties:
      email:
        example: jane@example.com
        type: string
      password:
        example: hunter2go
        type: string
    required:
    - email
    - password
    type: object
  forms.NeedToBuyForm:
    properties:
      need_to_buy:
        example: true
        type: boolean
    required:
    - need_to_buy
    type: object
  forms.PhoneForm:
    properties:
      phone:
        example: "+201001234567"
        type: string
    required:
    - phone
    type: object
  forms.RefreshForm:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  forms.RegisterEmailForm:
    properties:
      email:
        example: jane@example.com
        type: string
      password:
        example: hunter2go
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  forms.ShareListForm:
    properties:
      phone:
        example: "+201001234567"
        type: string
      role:
        enum:
        - editor
        - viewer
        example: editor
        type: string
    required:
    - phone
    - role
    type: object
  forms.UpdateItemForm:
    properties:
      attributes:
        additionalProperties: true
        type: object
      brand:
        type: string
      category_id:
        type: string
      clear_category:
        type: boolean
      name:
        maxLength: 255
        type: string
      notes:
        type: string
      price:
        type: number
    type: object
  forms.UpdateListForm:
    properties:
      category_id:
        type: string
      clear_category:
        type: boolean
      clear_grouped_list:
        type: boolean
      grouped_list_id:
        type: string
      is_periodic:
        type: boolean
      is_public:
        type: boolean
      name:
        maxLength: 255
        type: string
    type: object
  forms.UpdateProfileForm:
    properties:
      display_name:
        example: Jane D.
        type: string
      notification_prefs:
        additionalProperties: true
        type: object
      picture_url:
        example: https://cdn.example.com/u/jane.png
        type: string
    type: object
  forms.VerifyOTPForm:
    properties:
      code:
        example: "004213"
        type: string
      phone:
        example: "+201001234567"
        type: string
    required:
    - code
    - phone
    type: object
  healthHandlers.HealthResponse:
    properties:
      db:
        example: up
        type: string
      status:
        example: ok
        type: string
    type: object
  resources.ActivityEventResource:
    properties:
      action:
        type: string
      actor_id:
        type: string
      created_at:
        type: string
      id:
        type: string
      list_id:
        type: string
      payload:
        additionalProperties: true
        type: object
      target_id:
        type: string
      target_type:
        type: string
    type: object
  resources.AuthResource:
    properties:
      access_token:
        type: string
      expires_in:
        example: 28800
        type: integer
      refresh_token:
        type: string
      token_type:
        example: Bearer
        type: string
      user:
        $ref: '#/definitions/resources.UserResource'
    type: object
  resources.CategoryResource:
    properties:
      id:
        type: string
      is_owned:
        type: boolean
      is_system:
        type: boolean
      name:
        type: string
    type: object
  resources.CommentResource:
    properties:
      author_id:
        type: string
      body:
        type: string
      created_at:
        type: string
      id:
        type: string
      is_system:
        type: boolean
      item_id:
        type: string
    type: object
  resources.GroupedListResource:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  resources.ItemResource:
    properties:
      attributes:
        additionalProperties: true
        type: object
      brand:
        type: string
      category_id:
        type: string
      id:
        type: string
      in_misc:
        type: boolean
      list_id:
        type: string
      name:
        type: string
      need_to_buy:
        type: boolean
      notes:
        type: string
      price:
        type: number
    type: object
  resources.ListResource:
    properties:
      category_id:
        type: string
      grouped_list_id:
        type: string
      id:
        type: string
      is_periodic:
        type: boolean
      is_public:
        type: boolean
      name:
        type: string
    type: object
  resources.ListVariantResource:
    properties:
      generated_at:
        type: string
      generated_by:
        type: string
      id:
        type: string
      item_count:
        type: integer
      items:
        items:
          $ref: '#/definitions/resources.VariantItemResource'
        type: array
      periodic_list_id:
        type: string
      title:
        type: string
    type: object
  resources.ProfileResource:
    properties:
      display_name:
        type: string
      email:
        type: string
      id:
        type: string
      notification_prefs:
        additionalProperties: true
        type: object
      phone:
        type: string
      phone_verified:
        type: boolean
      picture_url:
        type: string
    type: object
  resources.ShareResultResource:
    properties:
      kind:
        description: '"share" or "invite"'
        type: string
      list_id:
        type: string
      phone:
        type: string
      role:
        type: string
      user_id:
        type: string
    type: object
  resources.SharedListResource:
    properties:
      category_id:
        type: string
      grouped_list_id:
        type: string
      id:
        type: string
      is_periodic:
        type: boolean
      is_public:
        type: boolean
      name:
        type: string
      role:
        type: string
    type: object
  resources.SubscriptionResource:
    properties:
      billing_provider:
        type: string
      current_period_end:
        type: string
      entitled:
        type: boolean
      product_id:
        type: string
      status:
        type: string
      tier:
        type: string
    type: object
  resources.UserResource:
    properties:
      email:
        type: string
      id:
        type: string
      is_active:
        type: boolean
      phone:
        type: string
      phone_verified:
        type: boolean
      role:
        type: string
    type: object
  resources.VariantItemResource:
    properties:
      attributes:
        additionalProperties: true
        type: object
      brand:
        type: string
      category_id:
        type: string
      id:
        type: string
      name:
        type: string
      notes:
        type: string
      price:
        type: number
      source_item_id:
        type: string
    type: object
  responses.ErrorResponse:
    properties:
      error:
        example: error message
        type: string
    type: object
  responses.ValidationErrorResponse:
    properties:
      errors:
        example:
        - phone is invalid
        - email is invalid
        items:
          type: string
        type: array
    type: object
  sharingServices.Collaborator:
    properties:
      email:
        type: string
      phone:
        type: string
      role:
        type: string
      user_id:
        type: string
    type: object
  sharingServices.Collaborators:
    properties:
      collaborators:
        items:
          $ref: '#/definitions/sharingServices.Collaborator'
        type: array
      invites:
        items:
          $ref: '#/definitions/sharingServices.Invite'
        type: array
    type: object
  sharingServices.Invite:
    properties:
      id:
        type: string
      phone:
        type: string
      role:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: Dalista API Support
  description: RESTful API for the Dalista shopping-list / shop-catalog sharing application.
  license:
    name: Proprietary
  termsOfService: http://swagger.io/terms/
  title: Dalista API
  version: "1.0"
paths:
  /admin/subscriptions:
    get:
      description: Subscriptions joined to owner contact fields, optionally filtered
        by tier and billing rail.
      parameters:
      - description: Filter by tier (free/basic/unlimited)
        in: query
        name: tier
        type: string
      - description: Filter by billing rail (apple_iap/google_play/stripe)
        in: query
        name: provider
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/billingServices.OversightRow'
            type: array
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List subscriptions (admin)
      tags:
      - billing-admin
  /admin/subscriptions/summary:
    get:
      description: Counts of subscriptions by tier, billing rail, and status for the
        dashboard.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/billingServices.SubscriptionSummary'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Subscription summary (admin)
      tags:
      - billing-admin
  /auth/facebook:
    post:
      consumes:
      - application/json
      description: Verifies a Facebook access token server-side, then signs in or
        creates the account. Returns access + refresh tokens.
      parameters:
      - description: Facebook access token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/forms.FacebookAuthForm'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/resources.AuthResource'
        "401":
          description: Invalid token
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "503":
          description: Facebook OAuth not configured
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Sign in / sign up with Facebook
      tags:
      - auth
  /auth/google:
    post:
      consumes:
      - application/json
      description: Verifies a Google ID token server-side, then signs in or creates
        the account. Returns access + refresh tokens.
      parameters:
      - description: Google ID token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/forms.GoogleAuthForm'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/resources.AuthResource'
        "401":
          description: Invalid token
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "503":
          description: Google OAuth not configured
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Sign in / sign up with Google
      tags:
      - auth
  /auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/forms.LoginEmailForm'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/resources.AuthResource'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ValidationErrorResponse'
        "401":
          description: Invalid credentials
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "403":
          description: Account deactivated
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Sign in with email & password
      tags:
      - auth
  /auth/logout:
    post:
      description: Stateless logout. Tokens are not server-side revocable in v1; the
        client discards them. Endpoint exists for a consistent contract and future
        revocation.
      produces:
      - application/json
      responses:
        "200":
          description: 'message: logged out'
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - auth
  /auth/otp/request:
    post:
      consumes:
      - application/json
      description: Sends a one-time code to the phone number. No account required
        — a new one is created on verify.
      parameters:
      - description: Phone number (E.164)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/forms.PhoneForm'
      produces:
      - application/json
      responses:
        "200":
          description: 'message: code sent'
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ValidationErrorResponse'
      summary: Request a phone sign-in OTP
      tags:
      - auth
  /auth/otp/verify:
    post:
      consumes:
      - application/json
      description: Verifies the code and signs in (creating the account on first use).
        Returns access + refresh tokens.
      parameters:
      - description: Phone + code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/forms.VerifyOTPForm'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/resources.AuthResource'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ValidationErrorResponse'
        "401":
          description: Invalid code
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "429":
          description: Too many attempts
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Verify a phone sign-in OTP
      tags:
      - auth
  /auth/phone/request:
    post:
      consumes:
      - application/json
      description: For an authenticated user who signed up via email/Google/Facebook
        — sends an OTP to the phone they want to verify.
      parameters:
      - description: Phone number (E.164)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/forms.PhoneForm'
      produces:
      - application/json
      responses:
        "200":
          description: 'message: code sent'
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "409":
          description: Phone already in use
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Request a phone-verification OTP (post-signup)
      tags:
      - auth
  /auth/phone/verify:
    post:
      consumes:
      - application/json
      description: Confirms the OTP and marks the authenticated user's phone verified.
      parameters:
      - description: Phone + code
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/forms.VerifyOTPForm'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/resources.ProfileResource'
        "401":
          description: Invalid code
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "409":
          description: Phone already in use
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Verify a phone number (post-signup)
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchanges a valid refresh token for a new access + refresh token
        pair.
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/forms.RefreshForm'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/resources.AuthResource'
        "401":
          description: Invalid or expired refresh token
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Refresh tokens
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates an email/password account and returns access + refresh
        tokens. Phone verification is a separate post-signup step.
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/forms.RegisterEmailForm'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/resources.AuthResource'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ValidationErrorResponse'
        "409":
          description: Email already registered
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Sign up with email & password
      tags:
      - auth
  /billing/apple/notifications:
    post:
      consumes:
      - application/json
      description: Apple delivers a JWS `signedPayload`; verified against the x5c
        chain, then the subscription state is synced. Public endpoint (authenticity
        is the signature).
      produces:
      - application/json
      responses:
        "200":
          description: acknowledged
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "401":
          description: Invalid signature
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: App Store Server Notifications V2 webhook
      tags:
      - billing-webhooks
  /billing/apple/verify:
    post:
      consumes:
      - application/json
      description: Server-side validation of a StoreKit transaction via the App Store
        Server API, then activates the tier. The client never self-reports entitlement.
      parameters:
      - description: Transaction id
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/forms.AppleVerifyForm'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/resources.SubscriptionResource'
        "402":
          description: Purchase not valid
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "503":
          description: Apple billing not configured
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Verify an Apple IAP purchase
      tags:
      - billing
  /billing/google/rtdn:
    post:
      consumes:
      - application/json
      description: Decodes the Pub/Sub envelope, re-verifies the purchase token against
        the Play Developer API (the real trust boundary), then syncs subscription
        state. Public endpoint.
      produces:
      - application/json
      responses:
        "200":
          description: acknowledged
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      summary: Google Play Real-time Developer Notifications (Pub/Sub push)
      tags:
      - billing-webhooks
  /billing/google/verify:
    post:
      consumes:
      - application/json
      description: Server-side validation of a Play Billing purchase token via the
        Play Developer API, then activates the tier.
      parameters:
      - description: Purchase token + subscription id
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/forms.GoogleVerifyForm'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/resources.SubscriptionResource'
        "402":
          description: Purchase not valid
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
        "503":
          description: Google billing not configured
          schema:
            $ref: '#/definitions/responses.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Verify a Google Play purchase
      tags:
      - billing
  /billing/storage:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/billingServices.StorageStatus'
      security:
      - BearerAuth: []
      summary: Get my storage usage vs. quota
      tags:
      - billing
  /billing/subscription:
    get:
      description: Returns the caller's current subscription (or the implicit free
        tier).
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/resources.SubscriptionResource'
      security:
      - BearerAuth: []
      summary: Get my subscription
      tags:
      - billing
  /categories:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/resources.CategoryResource'
            type: array
      security:
      - BearerAuth: []
      summary: List categories (own + system defaults)
      tags:
      - categories
    post:
      consumes:
      - application/json
      parameters:
      - description: Category
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/forms.CategoryForm'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/resources.CategoryResource'
      security:
      - BearerAuth: []
      summary: Create a category
